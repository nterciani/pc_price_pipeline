name: Daily Price Ingest

on:
  schedule:
    - cron: "7 6 * * *"   # daily at 6:07am UTC
  workflow_dispatch:

jobs:
  ingest:
    runs-on: self-hosted
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/key.json
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Authenticate to GCP
        shell: powershell
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          $keyPath = Join-Path $env:GITHUB_WORKSPACE "key.json"

          if ([string]::IsNullOrWhiteSpace($env:GCP_SERVICE_ACCOUNT_KEY)) {
            throw "GCP_SERVICE_ACCOUNT_KEY is empty"
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          [System.IO.File]::WriteAllText(
            $keyPath,
            $env:GCP_SERVICE_ACCOUNT_KEY,
            $utf8NoBom
          )

          Get-Content -Raw $keyPath | ConvertFrom-Json | Out-Null
          Write-Host "GCP credentials JSON is valid"

      - name: Run Dagster ETL
        run: |
          dagster job execute -m pc_price_pipeline.definitions -j daily_etl_job
